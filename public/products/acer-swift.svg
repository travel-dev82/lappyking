<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <rect width="200" height="160" rx="8" fill="#f5f5f5"/>
  <!-- Screen -->
  <rect x="35" y="18" width="130" height="82" rx="5" fill="#C0C0C8"/>
  <rect x="40" y="23" width="120" height="72" rx="2" fill="#2a2a3e"/>
  <!-- Acer green accent on bezel -->
  <line x1="46" y1="90" x2="60" y2="90" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
  <!-- Keyboard base - thin -->
  <path d="M25 100 L175 100 L180 107 L20 107 Z" fill="#C8C8D0"/>
  <rect x="20" y="107" width="160" height="3" rx="1" fill="#B8B8C0"/>
  <!-- Green accent line -->
  <rect x="30" y="100" width="140" height="1.5" rx="1" fill="#4CAF50" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a2e">Acer Swift</text>
  <text x="100" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4CAF50">Thin &amp; Light</text>
</svg>