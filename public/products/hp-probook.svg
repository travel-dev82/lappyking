  <!-- Label -->
  <text x="100" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a2e">HP ProBook</text>
  <text x="100" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0096D6">450 G9</text>
</svg>