<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <rect width="200" height="160" rx="8" fill="#f5f5f5"/>
  <!-- Screen -->
  <rect x="35" y="18" width="130" height="82" rx="4" fill="#A8A8B0"/>
  <rect x="40" y="23" width="120" height="72" rx="2" fill="#2a2a3e"/>
  <!-- HP logo hint -->
  <line x1="95" y1="53" x2="100" y2="63" stroke="#0096D6" stroke-width="1" opacity="0.4"/>
  <line x1="105" y1="53" x2="100" y2="63" stroke="#0096D6" stroke-width="1" opacity="0.4"/>
  <!-- Keyboard base -->
  <path d="M25 100 L175 100 L180 108 L20 108 Z" fill="#B0B0B8"/>
