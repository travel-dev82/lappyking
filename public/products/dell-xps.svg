<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <rect width="200" height="160" rx="8" fill="#f5f5f5"/>
  <!-- Screen - infinity edge bezel -->
  <rect x="35" y="18" width="130" height="82" rx="4" fill="#C0C0C8"/>
  <rect x="37" y="21" width="126" height="76" rx="2" fill="#1d1d1f"/>
  <!-- Dell logo hint on screen -->
  <circle cx="100" cy="58" r="6" fill="none" stroke="#0096D6" stroke-width="0.8" opacity="0.3"/>
  <!-- Keyboard base - carbon fiber -->
  <path d="M25 100 L175 100 L180 108 L20 108 Z" fill="#2a2a3e"/>
  <rect x="20" y="108" width="160" height="4" rx="1" fill="#1a1a2e"/>
  <!-- Blue accent -->
  <line x1="90" y1="100" x2="110" y2="100" stroke="#0096D6" stroke-width="2" opacity="0.6"/>
  <!-- Label -->
  <text x="100" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a2e">Dell XPS</text>
  <text x="100" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#0096D6">InfinityEdge</text>
</svg>