  <rect x="35" y="18" width="130" height="82" rx="6" fill="#B0B0B8"/>
  <rect x="40" y="24" width="120" height="70" rx="3" fill="#1d1d1f"/>
  <!-- Camera notch -->
  <circle cx="100" cy="23" r="1.5" fill="#555"/>
