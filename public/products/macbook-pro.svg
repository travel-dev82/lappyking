  <text x="100" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d1d1f">MacBook Pro</text>
  <text x="100" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#86868b">Silver · Space Gray</text>
</svg>