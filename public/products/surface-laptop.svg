<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <rect width="200" height="160" rx="8" fill="#f5f5f5"/>
  <!-- Screen - Alcantara style -->
  <rect x="35" y="18" width="130" height="82" rx="6" fill="#C8C8D0"/>
  <rect x="40" y="24" width="120" height="70" rx="3" fill="#2a2a3e"/>
  <!-- Windows logo hint -->
  <rect x="93" y="52" width="5" height="5" rx="0.5" fill="#00897B" opacity="0.4"/>
  <rect x="100" y="52" width="5" height="5" rx="0.5" fill="#00897B" opacity="0.4"/>
  <rect x="93" y="59" width="5" height="5" rx="0.5" fill="#00897B" opacity="0.4"/>
  <rect x="100" y="59" width="5" height="5" rx="0.5" fill="#00897B" opacity="0.4"/>
  <!-- Keyboard base with Alcantara -->
  <path d="M25 100 L175 100 L180 108 L20 108 Z" fill="#D8D0C8"/>
  <rect x="20" y="108" width="160" height="4" rx="1" fill="#C0B8B0"/>
  <!-- Teal accent -->
  <rect x="30" y="100" width="140" height="1.5" rx="1" fill="#00897B" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a2e">Surface Laptop</text>
  <text x="100" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#00897B">Platinum</text>
</svg>